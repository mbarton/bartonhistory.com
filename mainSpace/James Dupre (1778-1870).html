<ul><li>Born 30 June 1778, son of <a class="wiki_link" href="Josias%20Dupre%20%281726-1780%29.html">Josias Dupre (1726-1780)</a> and <a class="wiki_link" href="Rebella%20Alexander%20%281726-1785%29.html">Rebella Alexander (1726-1785)</a>.</li><li>Married <a class="wiki_link" href="Madeline%20Maxwell%20%281780-1818%29.html">Madeline Maxwell (1780-1818)</a>.</li><li>Died 13 June 1870, aged 91.</li></ul><br />

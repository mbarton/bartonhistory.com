<ul><li>Born 20 April 1832, daughter of <a class="wiki_link" href="John%20Barton%20Senior%20%281789-1852%29.html">John Barton Senior (1789-1852)</a> and <a class="wiki_link" href="Fanny%20Rickman%20%281807-1842%29.html">Fanny Rickman (1807-1842)</a>.</li><li>Mentioned in Emily's memoir as 'Aunt Bessie'.</li><li>Never married. Lived with her younger sister <a class="wiki_link" href="Emily%20Barton%20%281842-1927%29.html">Emily Barton (1842-1927)</a> and guardian <a class="wiki_link" href="Josephina%20Rickman%20%281808-1892%29.html">Josephina Rickman (1808-1892)</a>.</li></ul>

<ul><li>Born 9 April 1873, son of <a class="wiki_link" href="Josephina%20Barton%20%28b.1840%29.html">Josephina Barton (b.1840)</a> and <a class="wiki_link" href="Rev.%20Tom%20Causton%20%281835-1899%29.html">Rev. Tom Causton (1835-1899)</a>.</li><li>Married 'Winifred'.</li><li>Was 'domestic chaplain' for <a class="wiki_link" href="Rev.%20Handley%20Moule%20%281841-1920%29.html">Rev. Handley Moule (1841-1920)</a>.</li></ul>

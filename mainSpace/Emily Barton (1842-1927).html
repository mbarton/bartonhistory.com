    <div class="wiki" id="content_view" style="display: block;">
<ul><li>Born 4 November 1842, youngest child of <a class="wiki_link" href="John%20Barton%20Senior%20%281789-1852%29.html">John Barton Senior (1789-1852)</a> and <a class="wiki_link" href="Fanny%20Rickman%20%281807-1842%29.html">Fanny Rickman (1807-1842)</a>.</li><li>Died 1927, aged ~85.</li><li>Never married. Lived with her older sister <a class="wiki_link" href="Elizabeth%20Barton%20%28b.1832%29.html">Elizabeth Barton (b.1832)</a> and their guardian <a class="wiki_link" href="Josephina%20Rickman%20%281808-1892%29.html">Josephina Rickman (1808-1892)</a>.</li></ul>

    <div class="wiki" id="content_view" style="display: block;">
<ul><li>Born 27 December 1898, daughter of <a class="wiki_link" href="Rev.%20Cecil%20Barton%20%281870-1909%29.html">Rev. Cecil Barton (1870-1909)</a> and <a class="wiki_link" href="Esther%20Broadbent%20%281873-1959%29.html">Esther Broadbent (1873-1959)</a>.</li><li>Full name 'Esther Joan Barton' but always known as 'Joan'.</li><li>Twin of <a class="wiki_link" href="Dora%20Barton%20%281898-1962%29.html">Dora Barton (1898-1962)</a>.</li><li>Died 5 September 1900, aged 1½, of typhoid.</li></ul>

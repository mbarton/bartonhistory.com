<ul><li>Born 24 November 1897, eldest daughter of <a class="wiki_link" href="Fred%20Barton%20%281868-1929%29.html">Fred Barton (1868-1929)</a> and <a class="wiki_link" href="Anne%20Stote%20Fox%20%281867-1957%29.html">Anne Stote Fox (1867-1957)</a>.</li><li>Known as 'Marjory'.</li><li>Married (on 11 July 1922) <a class="wiki_link" href="Lionel%20Howe%20%28d.1961%29.html">Lionel Howe (d.1961)</a>.</li></ul>

<ul><li>Born 14 December 1837, fourth child of <a class="wiki_link" href="Rev.%20Charles%20Boileau%20Elliott%20%281803-1875%29.html">Rev. Charles Boileau Elliott (1803-1875)</a> and <a class="wiki_link" href="Emily%20Dougan%20%281806-1877%29.html">Emily Dougan (1806-1877)</a>.</li><li>Clearly named after his uncle <a class="wiki_link" href="William%20Henry%20Elliott%20%281811-1870%29.html">William Henry Elliott (1811-1870)</a>.</li><li>Died 22 August 1844, aged 6. (<a class="wiki_link" href="_Memoirs%20of%20Emily%20Elliott.html#13">*Memoirs of Emily Elliott p13</a>)</li></ul>

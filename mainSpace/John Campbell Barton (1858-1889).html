    <div class="wiki" id="content_view" style="display: block;">
<ul><li>Born 30 November 1858, son of <a class="wiki_link" href="Rev.%20Joseph%20Barton%20%281829-1905%29.html">Rev. Joseph Barton (1829-1905)</a> and <a class="wiki_link" href="Ellinor%20Taylor%20%281832-1862%29.html">Ellinor Taylor (1832-1862)</a>.</li><li>Known (at least in <a class="wiki_link" href="_Memoirs%20of%20Emily%20Elliott.html">Emily's memoir</a>) as 'Cam'.</li><li>Died 20 August 1889, aged 30, in <a class="wiki_link_ext" href="http://en.wikipedia.org/wiki/Sierra_Leone" rel="nofollow" target="_blank">Sierra Leone</a>, of <a class="wiki_link_ext" href="http://en.wikipedia.org/wiki/Blackwater_fever" rel="nofollow" target="_blank">Blackwater fever</a> (<a class="wiki_link" href="_Memoirs%20of%20Emily%20Elliott.html">Emily's memoir p93</a>).</li></ul>

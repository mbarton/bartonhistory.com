    <div class="wiki" id="content_view" style="display: block;">
<ul><li>Born 23 March 1845, son of <a class="wiki_link" href="Rev.%20Spencer%20Ruthven%20Thornton%20%281813-1850%29.html">Rev. Spencer Ruthven Thornton (1813-1850)</a> and <span style="color: #660000;"><a class="wiki_link" href="Caroline%20Adelaide%20Dupre%20%281815-1898%29.html">Caroline Adelaide Dupre (1815-1898)</a></span>.</li><li>Married (on 12 October 1869 in <a class="wiki_link_ext" href="http://maps.google.co.uk/maps?q=dorking,+surrey&amp;ie=UTF8&amp;hq=&amp;hnear=Dorking,+Surrey,+United+Kingdom&amp;gl=uk&amp;ei=GqAETeaJCNiAhAfF5uTsBw&amp;oi=geocode_result&amp;ved=0CBwQ8gEwAA&amp;z=12" rel="nofollow" target="_blank">Dorking, Surrey</a>), <a class="wiki_link" href="Theresa%20Labouchere%20%281844-1905%29.html">Theresa Labouchere (1844-1905)</a>.</li><li>Died 19 June 1895, aged 50.</li></ul>
    </div>

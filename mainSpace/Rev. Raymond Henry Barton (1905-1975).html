<ul><li>Born 15 January 1905, son of <a class="wiki_link" href="Rev.%20Jack%20Barton%20%281866-1941%29.html">Rev. Jack Barton (1866-1941)</a> and <a class="wiki_link" href="Susan%20Thornton%20%281875-1958%29.html">Susan Thornton (1875-1958)</a>.</li><li>Mentioned, as 'Ray', in the memoir of his sister <a class="wiki_link" href="Joy%20Barton%20%281907-1984%29.html">Joy Barton (1907-1984)</a>.</li><li>Married <a class="wiki_link" href="Cecily%20Fleming.html">Cecily Fleming</a>.</li><li>Died 1975, aged ~70.</li></ul>

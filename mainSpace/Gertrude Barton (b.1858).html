<ul><li>Born 22 January 1858, eldest daughter of <a class="wiki_link" href="Rev.%20Gerard%20Barton%20%281834-1889%29.html">Rev. Gerard Barton (1834-1889)</a> and Elizabeth Hazard.</li><li>Married (on 27 May 1885) Farrar Ranson (b.1854); see <a class="wiki_link_ext" href="http://freepages.genealogy.rootsweb.ancestry.com/~swilson/livingstone/wilson.htm" rel="nofollow" target="_blank">here</a>?</li><li>Lived at 17 Dartmouth Road, Blackheath (or possibly 17 Dartmouth Row, Blackheath)</li></ul>

<ul><li>Born 20 April 1876, son of <span style="cursor: pointer;"><a class="wiki_link" href="Rev.%20Joseph%20Barton%20%281829-1905%29.html">Rev. Joseph Barton (1829-1905)</a></span> and <span style="cursor: pointer;"><span style="color: #660000;"><a class="wiki_link" href="Susan%20Wilhelmina%20Sullivan%20%281844-1927%29.html">Susan Wilhelmina Sullivan (1844-1927)</a></span></span>.</li><li>Died 16 March 1900, in the <a class="wiki_link_ext" href="http://en.wikipedia.org/wiki/Second_Anglo-Boer_War" rel="nofollow" target="_blank">Second Anglo-Boer War</a> in South Africa, aged 23.</li></ul>

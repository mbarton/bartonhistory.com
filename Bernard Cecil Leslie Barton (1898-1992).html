<ul><li>Born 9 September 1898, second son of <a class="wiki_link" href="Rev.%20Jack%20Barton%20%281866-1941%29.html">Rev. Jack Barton (1866-1941)</a> and <a class="wiki_link" href="Susan%20Thornton%20%281875-1958%29.html">Susan Thornton (1875-1958)</a>.</li><li>Married, in July 1928, 'Nancy' <a class="wiki_link" href="Agnes%20Thomson%20%281900-1973%29.html">Agnes Thomson (1900-1973)</a>.</li><li>Became Chairman of Bluecoat's School, Nottingham.</li><li>Died 22 November 1992, aged 94.</li></ul><br />

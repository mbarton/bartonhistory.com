<ul><li>Born 1914, eldest child of <a class="wiki_link" href="Walter%20Lindsay%20Barton%20%281877-1952%29.html">Walter Lindsay Barton (1877-1952)</a> and <span style="color: #660000;"><a class="wiki_link" href="Mary%20%27Polinda%27%20Murray%20%281887-1978%29.html">Mary 'Polinda' Murray (1887-1978)</a></span>.</li><li>Married firstly <a class="wiki_link" href="Jean%20Nancy%20McCallum%20%28d.1952%29.html">Jean Nancy McCallum (d.1952)</a>.</li><li>Married secondly Cathleen Lennard Lott.</li><li>Author of an <a class="wiki_link" href="_Barton%201980s.html">unpublished biography</a> of <a class="wiki_link" href="John%20Barton%20Senior%20%281789-1852%29.html">John Barton Senior (1789-1852)</a>.</li></ul>
